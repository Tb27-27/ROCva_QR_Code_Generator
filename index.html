<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCva QR Code Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper" id="app-wrapper">
        <div class="container">
            <button id="toggle-colors-btn" class="toggle-btn" title="Customize Colors" aria-label="Customize colors" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
            </button>

            <button id="toggle-icon-btn" class="toggle-btn" title="Customize Icon" aria-label="Customize icon" aria-expanded="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
            </button>
            <header>
            <h1>ROCva QR Generator</h1>
            <p>Enter your URL or text below to generate a custom QR code.</p>
        </header>
        
        <main>
            <div class="input-group">
                <input type="text" id="qr-input" placeholder="Enter URL or text here..." value="https://www.rocva.nl/">
            </div>
            
            <div class="qr-preview-container">
                <div id="qr-preview"></div>
            </div>
            
            <div class="format-group">
                <label for="download-format">Format: </label>
                <select id="download-format">
                    <option value="png" selected>PNG (Image)</option>
                    <option value="svg">SVG (Vector)</option>
                </select>
            </div>
            
            <button id="download-btn" class="btn">Download</button>
        </main>
        </div> <!-- end container -->

        <!-- Slide-out Color Panel -->
        <div class="panel" id="color-panel">
            <h3>Colors</h3>
            <div class="color-option">
                <label for="color-dots">Dots</label>
                <input type="color" id="color-dots" value="#333333">
            </div>
            <div class="color-option">
                <label for="color-boxes">Boxes</label>
                <input type="color" id="color-boxes" value="#FF0028">
            </div>
            <div class="color-option">
                <label for="color-bg">Background</label>
                <input type="color" id="color-bg" value="#FFFFFF">
            </div>
        </div>

        <div class="panel" id="icon-panel">
            <h3>Icons</h3>
            <div class="icon-options" role="radiogroup" aria-label="Choose a logo">
                <label class="icon-choice">
                    <input type="radio" name="qr-icon" value="Logo_ROCvA.svg" checked>
                    <img src="Logo_ROCvA.svg" alt="">
                    <span>ROCvA</span>
                </label>
                <label class="icon-choice">
                    <input type="radio" name="qr-icon" value="logo_ROCvF.svg">
                    <img src="logo_ROCvF.svg" alt="">
                    <span>ROCvF</span>
                </label>
            </div>
        </div>
    </div> <!-- end app-wrapper -->

    <!-- qrcode library for generating the base QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
